name: CI

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      # An exercise whose src/ still contains todo!() is unfinished: it must
      # still build and pass lints, but its tests are skipped. Elsewhere only
      # enabled tests run, so tests that are still #[ignore]d don't fail CI.
      - name: Find unfinished exercises
        run: |
          wip=$(grep -rl --include='*.rs' 'todo!(' book/*/src exercises/*/src exercism/rust/*/src \
            | sed 's|/src/.*||' | sort -u | tr '\n' ' ' || true)
          echo "WIP=$wip" >> "$GITHUB_ENV"
          echo "Unfinished: ${wip:-none}"

      - name: Workspace (book and custom exercises)
        run: |
          cargo fmt --all --check
          cargo clippy --workspace --all-targets -- -D warnings
          excludes=""
          for dir in $WIP; do
            case "$dir" in
              book/*|exercises/*)
                name=$(sed -n 's/^name *= *"\(.*\)"/\1/p' "$dir/Cargo.toml" | head -1)
                excludes="$excludes --exclude $name" ;;
            esac
          done
          cargo test --workspace $excludes

      - name: Exercism exercises
        run: |
          for dir in exercism/rust/*/; do
            dir=${dir%/}
            echo "::group::$dir"
            (cd "$dir" && cargo fmt --check && cargo clippy --all-targets --all-features -- -D warnings)
            case " $WIP " in
              *" $dir "*) echo "Unfinished, skipping tests" ;;
              *) (cd "$dir" && cargo test --all-features) ;;
            esac
            echo "::endgroup::"
          done
